<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SwiftCab Fare Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .checkbox {
            width: auto;
            margin-right: 8px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #444;
        }

        #result {
            margin-top: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #aaa;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #222;
            color: white;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>SwiftCab Fare Calculator</h1>

    <label for="customerName">Customer Name:</label>
    <input type="text" id="customerName" placeholder="Enter customer name">


    <label for="rideType">Ride Type:</label>
    <select id="rideType">
        <option value="Mini">Mini</option>
        <option value="Sedan">Sedan</option>
        <option value="SUV">SUV</option>
    </select>


    <label for="distance">Distance (km):</label>
    <input type="number" id="distance" placeholder="Enter distance">


    <label for="pickupHour">Pickup Hour (0-23):</label>
    <input type="number" id="pickupHour" placeholder="Enter pickup hour">


    <label>
        <input type="checkbox" id="primeMember" class="checkbox">
        Prime Member
    </label>


    <button onclick="calculate()">Calculate Fare</button>


    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
